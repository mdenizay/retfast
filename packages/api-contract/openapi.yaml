      summary: Flight positions
      description: |
        Ordered by seq. Paged with after_seq/limit (default 1000, max 5000) or cursor. With `simplify=true` returns the
        whole route (h_acc_m <= 50, Douglas–Peucker, ≤ 5000 points) and next_cursor null.
        Addition: `tolerance_m` (default 5) for simplify.
      parameters:
        - { name: after_seq, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, maximum: 5000 } }
        - $ref: "#/components/parameters/Cursor"
        - { name: simplify, in: query, schema: { type: boolean } }
        - { name: tolerance_m, in: query, schema: { type: number, exclusiveMinimum: 0, maximum: 1000 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PositionPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /flights/{id}/track.gpx:
    parameters:
      - $ref: "#/components/parameters/FlightIdOrPublic"
    get:
      operationId: getFlightsIdTrackGpx
      tags: [flights]
      security: [{}, {bearerAuth: []}]
      summary: GPX 1.1 export (not a certified flight log)
      responses:
        "200":
          description: GPX document
          content:
            application/gpx+xml:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ============================================================ telemetry
  /telemetry/batches:
    post:
      operationId: postTelemetryBatches
      tags: [telemetry]
      summary: Upload a telemetry batch (flight owner)
      description: |
        1–500 samples, body ≤ 512 KB (gzip `Content-Encoding` accepted). A sample is acknowledged if it is in `accepted`
        or `duplicate`; both are durable in PostgreSQL when the response is sent. Re-sending the same batch_id returns the
        same classification. Out-of-order and late samples are accepted. Missing/invalid sample `id` or `seq`, or a wrong
        sample count, fail the whole batch with 422. Rate limit 600 batches/min per user.
      parameters:
        - name: Content-Encoding
          in: header
          schema: { type: string, enum: [gzip] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TelemetryBatch" }
      responses:
        "200":
          description: Classification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TelemetryResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Validation" }
        "429": { $ref: "#/components/responses/RateLimited" }

  # ============================================================ realtime
  /realtime:
    get:
      operationId: getRealtime
      tags: [live]
      security: [{}]
      summary: Realtime WebSocket (upgrade)
      description: |
        WebSocket upgrade (`wss://api.retfast.com/api/v1/realtime`). Browser Origin must match an allowed CORS origin.

        **Client → server**
        - `{"type":"auth","access_token":"…"}` — first message within 10 s (guests may instead subscribe to public
          channels directly). A connection that sends nothing in 10 s is closed with 4001. Invalid/expired token or a
          password-change-required user → `error` (`unauthorized` | `token_expired` | `password_change_required`) and close 4001
          if not yet authenticated. May be resent to refresh the token.
        - `{"type":"subscribe","channel":"event:<uuid>"|"flight:<uuid or public_id>"|"retrievals:<event uuid>","since":"<cursor>"?}`
        - `{"type":"unsubscribe","channel":"…"}` → `{"type":"unsubscribed","channel":"…"}`
        - `{"type":"ping"}` → `{"type":"pong"}`; reply `{"type":"pong"}` to server pings.

        **Server → client**
        - `{"type":"auth_ok","user_id":"…"}`
        - `{"type":"subscribed","channel","snapshot","cursor","replayed":N}` — snapshot is always present: LiveSnapshot
          for event channels, Flight for flight channels, LiveSnapshot without `pilots` for retrievals channels.
          If `since` is inside the Redis stream window, the N missed messages follow immediately after `subscribed`.
          Addition: `replayed` count.
        - `{"type":"position","channel":"event:…"|"flight:…","cursor","data":{flight_id,pilot,is_simulated,status,position},"server_received_ms"}`
        - `{"type":"flight","channel","cursor","data":Flight,"server_received_ms"}`; when the subscriber can no longer
          see the flight `data` is `{"id","event_id","removed":true}` (Addition).
        - `{"type":"retrieval","channel":"retrievals:…","cursor","data":Retrieval}` — redacted per subscriber like the REST
          representation; a retriever whose visible request was taken/cancelled/reassigned away gets
          `{"id","event_id","status","removed":true}` (Addition).
        - `{"type":"pilot_position","channel":"retrievals:…","cursor","data":{"retrieval_id","user_id","position":Position}}` —
          to the accepting retriever (while held), organizers, observers, admins and the pilot.
        - `{"type":"retriever_position","channel":"retrievals:…","cursor","data":{"user_id","full_name","on_duty","active_retrievals","position":RetrieverFix|null}}` —
          to organizers, observers, admins, the retriever and the pilot(s) whose open retrieval they hold. Also sent on
          duty changes (Addition: `on_duty`, `active_retrievals`).
        - `{"type":"error","code":"forbidden"|"unknown_channel"|"unauthorized"|"token_expired"|"password_change_required"|"bad_request"|"internal","channel"?}`
        - `{"type":"ping"}` every 25 s.

        `server_received_ms` (Addition) is the server receive time of the underlying data in unix ms, for latency measurement.
        Messages may be delivered more than once (at-least-once relay); dedupe by cursor / position seq.

        **Authorization** is checked at subscribe time and re-applied to every message against current facts: membership
        and event-setting changes are pushed to every instance through the outbox (internal `member_changed` /
        `event_changed` envelopes, never sent to clients). `event:` requires live access (retrievers are admitted but
        never receive pilot flights); `retrievals:` requires organizer, member or admin (guests: unauthorized; outsiders:
        forbidden).

        **Limits / close codes**: outbound queue 256 messages, overflow closes with 4008 (slow consumer); idle 60 s
        (no client message) closes with 1008; 4001 unauthorized; 1012 server restart. Reconnect with backoff (1 s → 30 s,
        jitter) and resubscribe with the last cursor.
      responses:
        "101":
          description: Switching Protocols
        "503":
          description: Server draining
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ============================================================ retrievals
  /events/{id}/retrievals:
    parameters:
      - $ref: "#/components/parameters/EventIdOrSlug"
    post:
      operationId: postEventsIdRetrievals
      tags: [retrievals]
      summary: Request a retrieval (event pilot)
      description: |
        201 when created, 200 if `id` already exists for this pilot (idempotent), 409 if the id belongs to someone else.
        One open retrieval per pilot per event: 409 with body `{"error":{…,"details":{"retrieval_id"}},"retrieval":Retrieval}`.
        Retrievers and organizers of the event are notified. The pickup point becomes the initial `pilot_position`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RetrievalCreate" }
      responses:
        "200":
          description: Existing retrieval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Retrieval" }
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Retrieval" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Id in use, or an open retrieval exists (then included as `retrieval`)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      retrieval: { $ref: "#/components/schemas/Retrieval" }
        "422": { $ref: "#/components/responses/Validation" }
        "429": { $ref: "#/components/responses/RateLimited" }
    get:
      operationId: getEventsIdRetrievals
      tags: [retrievals]
      summary: List retrievals (filtered per role)
      description: Organizers/observers/admins all; retrievers `requested` + those they hold; pilots their own. Non-members 403.
      parameters:
        - { name: status, in: query, description: "Comma list, e.g. requested,accepted,picked_up", schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Retrieval" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /retrievals/{rid}:
    parameters:
      - $ref: "#/components/parameters/RetrievalId"
    get:
      operationId: getRetrievalsId
      tags: [retrievals]
      summary: Get a retrieval (404 if not visible)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Retrieval" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /retrievals/{rid}/position:
    parameters:
      - $ref: "#/components/parameters/RetrievalId"
    post:
      operationId: postRetrievalsIdPosition
      tags: [retrievals]
      summary: Share the pilot's position while the retrieval is open (owning pilot)
      description: Updates `pilot_position` (seq increments) and publishes `pilot_position` on retrievals:<event_id>. 409 once delivered/cancelled.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PositionInput" }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  retrieval_id: { type: string, format: uuid }
                  position: { $ref: "#/components/schemas/Position" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /retrievals/{rid}/accept:
    parameters:
      - $ref: "#/components/parameters/RetrievalId"
    post:
      operationId: postRetrievalsIdAccept
      tags: [retrievals]
      summary: Accept (event retriever; first one wins)
      description: Conditional update from `requested`; 409 if already taken. Idempotent for the holder. Reveals phones (audited) and notifies the pilot.
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Retrieval" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /retrievals/{rid}/release:
    parameters:
      - $ref: "#/components/parameters/RetrievalId"
    post:
      operationId: postRetrievalsIdRelease
      tags: [retrievals]
      summary: Release back to requested (accepting retriever; only from accepted)
      responses:
        "200": { description: Released, content: { application/json: { schema: { $ref: "#/components/schemas/Retrieval" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /retrievals/{rid}/assign:
    parameters:
      - $ref: "#/components/parameters/RetrievalId"
    post:
      operationId: postRetrievalsIdAssign
      tags: [retrievals]
      summary: Assign or reassign (organizer/admin; from requested or accepted)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [retriever_user_id]
              properties:
                retriever_user_id: { type: string, format: uuid, description: Must be an active retriever of the event (else 422). }
      responses:
        "200": { description: Assigned, content: { application/json: { schema: { $ref: "#/components/schemas/Retrieval" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /retrievals/{rid}/picked-up:
    parameters:
      - $ref: "#/components/parameters/RetrievalId"
    post:
      operationId: postRetrievalsIdPickedUp
      tags: [retrievals]
      summary: Mark picked up (accepting retriever; from accepted; idempotent)
      responses:
        "200": { description: Picked up, content: { application/json: { schema: { $ref: "#/components/schemas/Retrieval" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /retrievals/{rid}/delivered:
    parameters:
      - $ref: "#/components/parameters/RetrievalId"
    post:
      operationId: postRetrievalsIdDelivered
      tags: [retrievals]
      summary: Mark delivered (accepting retriever; from picked_up; idempotent)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 1000 }
      responses:
        "200": { description: Delivered, content: { application/json: { schema: { $ref: "#/components/schemas/Retrieval" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /retrievals/{rid}/cancel:
    parameters:
      - $ref: "#/components/parameters/RetrievalId"
    post:
      operationId: postRetrievalsIdCancel
      tags: [retrievals]
      summary: Cancel (own pilot or organizer/admin; from requested/accepted/picked_up)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 1000 }
      responses:
        "200": { description: Cancelled, content: { application/json: { schema: { $ref: "#/components/schemas/Retrieval" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /retrievals/{rid}/notes:
    parameters:
      - $ref: "#/components/parameters/RetrievalId"
    post:
      operationId: postRetrievalsIdNotes
      tags: [retrievals]
      summary: Add a note (pilot, accepting retriever, organizer/admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        "201": { description: Added, content: { application/json: { schema: { $ref: "#/components/schemas/Retrieval" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /events/{id}/retrievers/me/position:
    parameters:
      - $ref: "#/components/parameters/EventIdOrSlug"
    post:
      operationId: postEventsIdRetrieversMePosition
      tags: [retrievals]
      summary: Share the retriever's position (event retriever)
      description: Allowed while on duty or holding an accepted/picked-up retrieval (else 409). Publishes `retriever_position`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PositionInput" }
      responses:
        "200":
          description: Current state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetrieverState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /events/{id}/retrievers/me/duty:
    parameters:
      - $ref: "#/components/parameters/EventIdOrSlug"
    put:
      operationId: putEventsIdRetrieversMeDuty
      tags: [retrievals]
      summary: Go on / off duty (event retriever)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [on_duty]
              properties:
                on_duty: { type: boolean }
      responses:
        "200":
          description: Current state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetrieverState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }

  # ============================================================ notifications
  /notifications:
    get:
      operationId: getNotifications
      tags: [notifications]
      summary: List own notifications
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /notifications/{id}/read:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: postNotificationsIdRead
      tags: [notifications]
      summary: Mark one as read
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /notifications/read-all:
    post:
      operationId: postNotificationsReadAll
      tags: [notifications]
      summary: Mark all as read
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ============================================================ admin
  /admin/users:
    get:
      operationId: getAdminUsers
      tags: [admin]
      summary: Search users (platform_admin)
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: patchAdminUsersId
      tags: [admin]
      summary: Grant/revoke platform_admin, disable (platform_admin)
      description: Admins cannot remove their own platform_admin privilege or disable themselves. Disabling revokes all sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_platform_admin: { type: boolean }
                disabled: { type: boolean }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/users/{id}/reset-password:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: postAdminUsersIdResetPassword
      tags: [admin]
      summary: Send a password reset email (platform_admin)
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Accepted" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/audit:
    get:
      operationId: getAdminAudit
      tags: [admin]
      summary: Audit log (platform_admin)
      description: "`action` matches exactly or as a prefix (`retrieval` matches `retrieval.*`). limit default 100, max 500."
      parameters:
        - { name: actor_id, in: query, schema: { type: string, format: uuid } }
        - { name: action, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, maximum: 500 } }
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Dashboard counters (platform_admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminStats" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
