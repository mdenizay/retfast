name: ci

on:
  push:
    branches: [rebuild, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Validate design tokens (WCAG contrast) and check generated files are current
        run: |
          node packages/design-tokens/build.mjs
          git diff --exit-code packages/design-tokens/dist

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env: { POSTGRES_USER: retfast, POSTGRES_PASSWORD: retfast, POSTGRES_DB: retfast_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U retfast" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      RETFAST_TEST_DATABASE_URL: postgres://retfast:retfast@localhost:5432/retfast_test?sslmode=disable
      RETFAST_TEST_REDIS_URL: redis://localhost:6379/0
    defaults:
      run: { working-directory: services/api }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: services/api/go.mod, cache-dependency-path: services/api/go.sum }
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: sqlc generated code is current
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          sqlc diff
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - run: go test -race -count=1 ./...
      - run: go build -o bin/ ./cmd/...

  web:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: apps/web }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { package_json_file: apps/web/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: apps/web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high

  images:
    needs: [api, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build api image
        uses: docker/build-push-action@v6
        with: { context: ., file: infrastructure/docker/api.Dockerfile, push: false, cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: Build web image
        uses: docker/build-push-action@v6
        with: { context: ., file: infrastructure/docker/web.Dockerfile, push: false, cache-from: type=gha, cache-to: "type=gha,mode=max" }

  ios:
    runs-on: macos-latest
    continue-on-error: true # hosted runners may lag the Xcode version used locally; local results are recorded in docs/testing/results.md
    steps:
      - uses: actions/checkout@v4
      - name: Build and test the iOS core package
        run: |
          if [ -f apps/ios/RetfastCore/Package.swift ]; then cd apps/ios/RetfastCore && swift test; else echo "no core package"; fi

  # Staging = push to `rebuild`, production = push to `main` (environment `production` requires approval in GitHub).
  deploy:
    needs: [tokens, api, web, images]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Trigger Dokploy deployment and wait
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          DOKPLOY_COMPOSE_ID: ${{ vars.DOKPLOY_COMPOSE_ID }}
          SMOKE_API_URL: ${{ vars.SMOKE_API_URL }}
          SMOKE_WEB_URL: ${{ vars.SMOKE_WEB_URL }}
        run: |
          if [ -z "$DOKPLOY_TOKEN" ] || [ -z "$DOKPLOY_COMPOSE_ID" ]; then echo "deployment not configured for this environment; skipping"; exit 0; fi
          infrastructure/scripts/deploy.sh "$DOKPLOY_COMPOSE_ID"
          infrastructure/scripts/smoke.sh "$SMOKE_API_URL" "$SMOKE_WEB_URL"
