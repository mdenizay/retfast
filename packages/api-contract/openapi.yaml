        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /flights/{id}/positions:
    parameters:
      - $ref: "#/components/parameters/FlightIdOrPublic"
    get:
      operationId: getFlightsIdPositions
      tags: [flights]
      security: [{}, {bearerAuth: []}]
      summary: Flight positions
      description: |
        Ordered by seq. Paged with after_seq/limit (default 1000, max 5000) or cursor. With `simplify=true` returns the
        whole route (h_acc_m <= 50, Douglas–Peucker, ≤ 5000 points) and next_cursor null.
        Addition: `tolerance_m` (default 5) for simplify.
      parameters:
