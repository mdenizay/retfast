  # ============================================================ flights
  /flights:
    get:
      operationId: getFlights
      tags: [flights]
      summary: List flights
      description: |
        Default: own flights. `?event_id=` (organizers/observers/admins: all; pilots: own plus others when
        pilots_see_each_other; retrievers and outsiders 403). `?pilot_id=` (admin: all; organizers: that pilot's flights
        in events they organise).
      parameters:
        - { name: pilot_id, in: query, schema: { type: string, format: uuid } }
        - { name: event_id, in: query, schema: { type: string } }
        - { name: status, in: query, description: "Comma list of recording,ended,abandoned", schema: { type: string } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlightPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
    post:
      operationId: postFlights
      tags: [flights]
      summary: Create a flight (idempotent on id)
      description: |
        201 when created, 200 if the id already exists for this pilot, 409 if it belongs to someone else.
        With event_id the caller must have the pilot role in the event, the event must have live_tracking and must not be draft/completed/archived. Without event_id the flight is private to its pilot.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FlightCreate" }
      responses:
        "200":
          description: Existing flight
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Flight" }
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Flight" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /flights/{id}:
    parameters:
      - $ref: "#/components/parameters/FlightIdOrPublic"
    get:
      operationId: getFlightsId
      tags: [flights]
      security: [{}, {bearerAuth: []}]
      summary: Get a flight
      description: |
        Visible to: owner and admins; for event flights: organizers and observers of the event, its pilots when
        pilots_see_each_other, and everyone (display names only) when the event is public with public_live_map.
        Retrievers: never. Flights outside events are private. Otherwise 404.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Flight" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: patchFlightsId
      tags: [flights]
      summary: Change the event link (owner, only while recording; 409 otherwise)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event_id: { type: [string, "null"], format: uuid }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Flight" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /flights/{id}/end:
    parameters:
      - $ref: "#/components/parameters/FlightIdOrPublic"
    post:
      operationId: postFlightsIdEnd
      tags: [flights]
      summary: End a flight (owner, idempotent)
      description: Recomputes final statistics from all stored positions. ended_at defaults to now.
      requestBody:
        content:
          application/json:
            schema:
              type: object
