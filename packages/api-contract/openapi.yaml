openapi: 3.1.0
info:
  title: Retfast API
  version: "1.0.0"
  description: |
    Machine-readable form of docs/architecture/api-contract.md, describing what
    services/api implements. Conventions: JSON, UTF-8, snake_case; timestamps are
    RFC 3339 UTC with milliseconds; IDs are UUIDs; client-generated IDs (flights,
    samples, retrievals, batches) make creation idempotent.

    Retfast is an event tracking and pilot retrieval platform (ADR-012). Users have no
    role of their own; roles are per event (organizer; member role pilot | observer |
    retriever). The only global privilege is platform_admin.

    Every response carries `X-Request-Id`. Errors use the envelope
    `{"error":{"code","message","details"}}`. Rate-limited responses (429) carry
    `Retry-After` (seconds).

    While `user.must_change_password` is true, every authenticated endpoint except
    `GET /me`, `POST /auth/password/change`, `POST /auth/logout` and
    `POST /auth/refresh` returns `403 password_change_required` (this includes
    optional-auth endpoints when a token is sent).

    Additions relative to the contract document are marked "Addition:" in the
    operation descriptions.
servers:
  - url: https://api.retfast.com/api/v1
    description: Production
  - url: http://localhost:8080/api/v1
    description: Local development

tags:
  - name: health
  - name: auth
  - name: me
  - name: pilots
  - name: events
  - name: flights
  - name: telemetry
  - name: live
  - name: retrievals
  - name: notifications
  - name: admin

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: HS256 access token, 15 min. Claims sub, roles, pcr (password change required), sid (session family).
    refreshCookie:
      type: apiKey
      in: cookie
      name: rf_refresh
      description: Web refresh token cookie (HttpOnly; Secure outside development; SameSite=Strict; Path=/api/v1/auth). Cookie use requires an allowed Origin if an Origin header is present.

  headers:
    X-Request-Id:
      description: Request correlation id (echoed if the client sent a valid one).
      schema: { type: string }
    Retry-After:
      description: Seconds until the rate-limit window resets.
      schema: { type: integer }

  parameters:
    EventIdOrSlug:
      name: id
      in: path
      required: true
      description: Event UUID or slug (all event routes accept either).
      schema: { type: string }
    FlightIdOrPublic:
      name: id
      in: path
      required: true
      description: Flight UUID or public_id.
      schema: { type: string }
    RetrievalId:
      name: rid
      in: path
      required: true
      description: Retrieval UUID (client-generated).
      schema: { type: string, format: uuid }
    AppId:
      name: app_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: user_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      description: Page size (default 50, max 200 unless stated otherwise).
      schema: { type: integer, minimum: 1 }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's next_cursor.
      schema: { type: string }

  responses:
    NoContent:
      description: No content
      headers:
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
    BadRequest:
      description: Malformed body (code validation_failed)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing/invalid credentials (code unauthorized) or expired access token (code token_expired)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Not allowed (code forbidden) or password change required (code password_change_required)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found or not visible to the caller (code not_found)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Conflict (code conflict)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Validation:
      description: Validation failed (code validation_failed, details maps field to reason)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooLarge:
      description: Body too large (code validation_failed)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many requests (code rate_limited)
      headers:
        Retry-After: { $ref: "#/components/headers/Retry-After" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Timestamp:
      type: string
      format: date-time
      examples: ["2026-11-04T12:00:00.123Z"]

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [validation_failed, unauthorized, token_expired, password_change_required, forbidden, not_found, conflict, rate_limited, internal, unavailable]
            message: { type: string }
            details:
              type: object
              additionalProperties: { type: string }

    Accepted:
      type: object
      properties:
        status: { type: string, const: accepted }

    LatLon:
      type: object
      required: [lat, lon]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lon: { type: number, minimum: -180, maximum: 180 }

    UserRef:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        full_name: { type: string }

    PilotRef:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        full_name: { type: string, description: "For guests/non-members this is the pilot's display_name." }
        public_id: { type: string }

    MemberRole:
      type: string
      enum: [pilot, observer, retriever]

    # ------------------------------------------------------------ health
    Health:
      type: object
      properties:
        status: { type: string, const: ok }
        version: { type: string }
    Ready:
      type: object
      properties:
        status: { type: string, enum: [ok, degraded, draining, unavailable] }
        checks:
          type: object
          properties:
            postgres: { type: string, enum: [ok, error] }
            redis: { type: string, enum: [ok, error] }
    Meta:
      type: object
      properties:
        environment: { type: string, enum: [development, staging, production] }
        version: { type: string }
        email_configured: { type: boolean }
        push_configured: { type: boolean }

    # ------------------------------------------------------------ auth / me
    Preferences:
      type: object
      properties:
        units: { type: string, enum: [metric, imperial] }
        public_profile: { type: boolean }
    PilotProfile:
      type: object
      description: |
        phone and emergency contact are returned to the user via /me. The phone is shown to event organizers/admins
        (member list, retrievals) and, inside an accepted retrieval, to the accepting retriever.
      properties:
        public_id: { type: string, readOnly: true }
        display_name: { type: string, maxLength: 200 }
        bio: { type: string, maxLength: 2000 }
        wing: { type: string, maxLength: 200 }
        license_no: { type: string, maxLength: 100 }
        nationality: { type: string, description: "ISO 3166-1 alpha-2 or empty" }
        phone: { type: string, maxLength: 50 }
        emergency_contact_name: { type: string, maxLength: 200 }
        emergency_contact_phone: { type: string, maxLength: 50 }
    PublicPilot:
      type: object
      description: Public profile; never contains phone, contact, emergency or licence fields.
      properties:
        public_id: { type: string }
        display_name: { type: string }
        bio: { type: string }
        wing: { type: string }
        nationality: { type: string }
    Me:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        email_verified: { type: boolean }
        full_name: { type: string }
        roles:
          type: array
          description: Global roles only; `platform_admin` is the only one. Ordinary users have `[]`.
          items: { type: string, enum: [platform_admin] }
        must_change_password: { type: boolean }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        pilot:
          oneOf:
            - $ref: "#/components/schemas/PilotProfile"
            - type: "null"
        preferences: { $ref: "#/components/schemas/Preferences" }
    AuthResponse:
      type: object
      required: [access_token, access_expires_at, refresh_expires_at, user]
      properties:
        access_token: { type: string }
        access_expires_at: { $ref: "#/components/schemas/Timestamp" }
        refresh_token:
          type: string
          description: Opaque, 30 days, rotated on every refresh. Omitted for client=web (set as rf_refresh cookie instead).
        refresh_expires_at: { $ref: "#/components/schemas/Timestamp" }
        user: { $ref: "#/components/schemas/Me" }
    Device:
      type: object
      required: [device_id, platform]
      properties:
        device_id: { type: string, maxLength: 200 }
        platform: { type: string, const: ios }
        apns_token: { type: [string, "null"], maxLength: 400 }
        app_version: { type: string, maxLength: 50 }
        os_version: { type: string, maxLength: 50 }
    DeletionRequest:
      type: object
      properties:
        status: { type: string, const: pending }
        requested_at: { $ref: "#/components/schemas/Timestamp" }
        scheduled_for:
          $ref: "#/components/schemas/Timestamp"
    UserSearchItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        full_name: { type: string }
        email: { type: string }
        public_id: { type: [string, "null"] }

    # ------------------------------------------------------------ events
    EventSettings:
      type: object
      properties:
        applications_open: { type: boolean, default: true }
        live_tracking: { type: boolean, default: true }
        public_live_map: { type: boolean, default: false }
        pilots_see_each_other: { type: boolean, default: true }
        landing_prompt: { type: boolean, default: true }
    Event:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, pattern: "^[a-z0-9][a-z0-9-]{1,99}$" }
        name: { type: string }
        description: { type: string }
        kind: { type: string, enum: [paragliding, hang_gliding, speed_flying, other] }
        status: { type: string, enum: [draft, published, active, completed, archived] }
        is_demo: { type: boolean }
        visibility: { type: string, enum: [public, restricted] }
        location_name: { type: string }
        center:
          oneOf:
            - $ref: "#/components/schemas/LatLon"
            - type: "null"
        center_is_approximate: { type: boolean }
        starts_at: { $ref: "#/components/schemas/Timestamp" }
        ends_at: { $ref: "#/components/schemas/Timestamp" }
        cover_image_url: { type: [string, "null"] }
        settings: { $ref: "#/components/schemas/EventSettings" }
        organizers: { type: array, items: { $ref: "#/components/schemas/UserRef" } }
        counts:
          type: object
          properties:
            pilots: { type: integer }
            observers: { type: integer }
            retrievers: { type: integer }
            pending_applications: { type: [integer, "null"], description: Organizers/admins only; null otherwise. }
        me:
          type: object
          properties:
            is_organizer: { type: boolean }
            role:
              oneOf:
                - $ref: "#/components/schemas/MemberRole"
                - type: "null"
            application:
              description: The caller's latest application unless it was approved.
              oneOf:
                - type: object
                  properties:
                    id: { type: string, format: uuid }
                    status: { type: string, enum: [pending, rejected, withdrawn] }
                - type: "null"
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    EventInput:
      type: object
      description: Create requires name, starts_at, ends_at. PATCH applies only present fields; `center` and `cover_image_url` accept null to clear.
      properties:
        slug: { type: string }
        name: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 10000 }
        kind: { type: string, enum: [paragliding, hang_gliding, speed_flying, other] }
        status: { type: string, enum: [draft, published, active, completed, archived] }
        visibility: { type: string, enum: [public, restricted] }
        location_name: { type: string, maxLength: 300 }
        center:
          oneOf:
            - $ref: "#/components/schemas/LatLon"
            - type: "null"
        center_is_approximate: { type: boolean }
        starts_at: { $ref: "#/components/schemas/Timestamp" }
        ends_at: { $ref: "#/components/schemas/Timestamp" }
        cover_image_url: { type: [string, "null"], description: https URL }
        settings: { $ref: "#/components/schemas/EventSettings" }
    Member:
      type: object
      description: Union of organizers and members. `role` is null for an organizer without a member role.
      properties:
        user_id: { type: string, format: uuid }
        full_name: { type: string }
        public_id: { type: [string, "null"] }
        role:
          oneOf:
            - $ref: "#/components/schemas/MemberRole"
            - type: "null"
        is_organizer: { type: boolean }
        status: { type: string, enum: [active, removed] }
        joined_at: { $ref: "#/components/schemas/Timestamp" }
        phone: { type: string, description: "Organizers/admins only (field absent otherwise); every reveal is audited." }
    Application:
      type: object
      description: Applications carry no role; the organizer chooses it on approval.
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        user:
          type: object
          properties:
            user_id: { type: string, format: uuid }
            full_name: { type: string }
            email: { type: string }
            public_id: { type: [string, "null"] }
        message: { type: string }
        status: { type: string, enum: [pending, approved, rejected, withdrawn] }
        granted_role:
          oneOf:
            - $ref: "#/components/schemas/MemberRole"
            - type: "null"
        decided_by:
          oneOf:
            - $ref: "#/components/schemas/UserRef"
            - type: "null"
        decision_note: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        decided_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
    LaunchSite:
      type: object
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        name: { type: string }
        position:
          oneOf:
            - $ref: "#/components/schemas/LatLon"
            - type: "null"
        elevation_m: { type: [number, "null"] }
        notes: { type: string }
        is_verified: { type: boolean, description: "Cannot be true while position is null." }
    LaunchSiteInput:
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        position:
          oneOf:
            - $ref: "#/components/schemas/LatLon"
            - type: "null"
        elevation_m: { type: [number, "null"], minimum: -500, maximum: 9000 }
        notes: { type: string, maxLength: 2000 }
        is_verified: { type: boolean }
    EventReport:
      type: object
      properties:
        event_id: { type: string, format: uuid }
        generated_at: { $ref: "#/components/schemas/Timestamp" }
        members:
          type: object
          properties:
            pilots: { type: integer }
            observers: { type: integer }
            retrievers: { type: integer }
            organizers: { type: integer }
            removed: { type: integer }
            pending_applications: { type: integer }
            pilots_flown: { type: integer }
        flights:
          type: object
          properties:
            count: { type: integer }
            by_status: { type: object, additionalProperties: { type: integer } }
            total_duration_s: { type: number }
            avg_duration_s: { type: number }
        telemetry:
          type: object
          properties:
            samples: { type: integer }
            expected_samples: { type: integer, description: 1 Hz target between first and last sample }
            completeness: { type: [number, "null"] }
            interruptions: { type: integer, description: Sum of gaps > 10 s }
            note: { type: string }
        retrievals:
          type: object
          properties:
            count: { type: integer }
            simulated: { type: integer }
            by_status: { type: object, additionalProperties: { type: integer } }
            median_request_to_accept_s: { type: [number, "null"] }
            median_accept_to_pickup_s: { type: [number, "null"] }
            median_pickup_to_delivery_s: { type: [number, "null"] }
        items:
          type: array
          items:
            type: object
            properties:
              flight_id: { type: string, format: uuid }
              pilot_id: { type: string, format: uuid }
              pilot_name: { type: string }
              status: { type: string }
              is_simulated: { type: boolean }
              duration_s: { type: number }
              sample_count: { type: integer }
              expected_sample_count: { type: integer }
              telemetry_completeness: { type: [number, "null"] }
              interruptions: { type: integer }
              distance_m: { type: number }
              max_gps_alt_m: { type: [number, "null"] }

    # ------------------------------------------------------------ flights
    Position:
      type: object
      properties:
        id: { type: string, format: uuid, description: The client sample id (server-generated for retrieval positions) }
        seq: { type: integer }
        t: { $ref: "#/components/schemas/Timestamp" }
        received_at: { $ref: "#/components/schemas/Timestamp" }
        lat: { type: number }
        lon: { type: number }
        gps_alt_m: { type: [number, "null"] }
        h_acc_m: { type: number }
        v_acc_m: { type: [number, "null"] }
        speed_ms: { type: [number, "null"] }
        course_deg: { type: [number, "null"] }
    FlightStats:
      type: object
      description: Distance/altitude/speed/ascent use only samples with h_acc_m <= 50; ascent/descent use a 3 m dead band; gaps are > 10 s between consecutive seqs; expected_sample_count = 1 Hz between first and last sample.
      properties:
        duration_s: { type: number }
        distance_m: { type: number }
        max_gps_alt_m: { type: [number, "null"] }
        min_gps_alt_m: { type: [number, "null"] }
        max_ground_speed_ms: { type: [number, "null"] }
        total_ascent_m: { type: number }
        total_descent_m: { type: number }
        sample_count: { type: integer }
        expected_sample_count: { type: integer }
        gap_count: { type: integer }
    Flight:
      type: object
      properties:
        id: { type: string, format: uuid }
        public_id: { type: string }
        pilot: { $ref: "#/components/schemas/PilotRef" }
        event_id: { type: [string, "null"], format: uuid }
        status: { type: string, enum: [recording, ended, abandoned] }
        is_simulated: { type: boolean }
        started_at: { $ref: "#/components/schemas/Timestamp" }
        ended_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        last_position:
          oneOf:
            - $ref: "#/components/schemas/Position"
            - type: "null"
        last_received_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        stats: { $ref: "#/components/schemas/FlightStats" }
        device:
          type: object
          properties:
            platform: { type: string }
            app_version: { type: string }
    FlightCreate:
      type: object
      required: [id, started_at]
      properties:
        id: { type: string, format: uuid }
        event_id: { type: [string, "null"], format: uuid }
        started_at: { $ref: "#/components/schemas/Timestamp" }
        is_simulated: { type: boolean, default: false }
        device:
          type: object
          properties:
            platform: { type: string, default: ios }
            app_version: { type: string }

    # ------------------------------------------------------------ telemetry
    TelemetrySample:
      type: object
      required: [id, seq]
      properties:
        id: { type: string, format: uuid }
        seq: { type: integer, minimum: 0, maximum: 2147483647 }
        t: { $ref: "#/components/schemas/Timestamp" }
        device_t: { $ref: "#/components/schemas/Timestamp" }
        lat: { type: number }
        lon: { type: number }
        gps_alt_m: { type: [number, "null"] }
        h_acc_m: { type: number }
        v_acc_m: { type: [number, "null"], description: "Negative values are stored as null." }
        speed_ms: { type: [number, "null"], description: "Negative (Core Location sentinel) stored as null; > 150 rejected invalid_speed." }
        course_deg: { type: [number, "null"], description: "Outside 0..360 stored as null." }
        meta: { type: object, description: "Free-form, <= 2 KB (dropped if larger)." }
    TelemetryBatch:
      type: object
      required: [batch_id, flight_id, samples]
      properties:
        batch_id: { type: string, format: uuid }
        flight_id: { type: string, format: uuid }
        samples:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: "#/components/schemas/TelemetrySample" }
    TelemetryResult:
      type: object
      properties:
        batch_id: { type: string, format: uuid }
        accepted: { type: array, items: { type: integer } }
        duplicate: { type: array, items: { type: integer } }
        rejected:
          type: array
          items:
            type: object
            properties:
              seq: { type: integer }
              reason:
                type: string
                enum: [invalid_coordinates, invalid_accuracy, timestamp_out_of_range, flight_ended, invalid_speed, sample_conflict]
                description: sample_conflict = sample id reused with a different (flight_id, seq), or same seq with a different id (client bug).
        max_acked_seq: { type: [integer, "null"], description: Highest seq in accepted ∪ duplicate of this batch. }
        server_time: { $ref: "#/components/schemas/Timestamp" }

    # ------------------------------------------------------------ retrievals
    PositionInput:
      type: object
      required: [lat, lon, t]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lon: { type: number, minimum: -180, maximum: 180 }
        gps_alt_m: { type: [number, "null"] }
        h_acc_m: { type: number, exclusiveMinimum: 0, maximum: 10000, description: Required for position updates; optional for a pickup. }
        t: { $ref: "#/components/schemas/Timestamp" }
        course_deg: { type: [number, "null"] }
        speed_ms: { type: [number, "null"] }
    RetrievalCreate:
      type: object
      required: [id, pickup]
      properties:
        id: { type: string, format: uuid, description: Client-generated; creation is idempotent on it. }
        flight_id: { type: [string, "null"], format: uuid, description: Own flight in this event; a simulated flight makes the retrieval simulated. }
        pickup: { $ref: "#/components/schemas/PositionInput" }
        note: { type: string, maxLength: 1000 }
        is_simulated: { type: boolean, default: false, description: "Addition: set by the simulator." }
    RetrieverFix:
      type: object
      properties:
        lat: { type: number }
        lon: { type: number }
        h_acc_m: { type: [number, "null"] }
        t: { $ref: "#/components/schemas/Timestamp" }
        course_deg: { type: [number, "null"] }
        speed_ms: { type: [number, "null"] }
    Retrieval:
      type: object
      description: |
        Redacted per viewer. Phones: organizers/admins; the pilot's own; the accepting retriever sees the pilot's phone and
        the pilot sees the retriever's while the retrieval is accepted/picked_up (otherwise ""). `pilot_position` is
        null for retrievers who do not hold it (and for the holder after delivery). `retriever_position` and `updates`
        are hidden from other retrievers.
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        flight_id: { type: [string, "null"], format: uuid }
        pilot:
          type: object
          properties:
            user_id: { type: string, format: uuid }
            full_name: { type: string }
            public_id: { type: string }
            phone: { type: string }
        status: { type: string, enum: [requested, accepted, picked_up, delivered, cancelled] }
        pickup:
          type: object
          properties:
            lat: { type: number }
            lon: { type: number }
            gps_alt_m: { type: [number, "null"] }
            h_acc_m: { type: [number, "null"] }
            t: { $ref: "#/components/schemas/Timestamp" }
        pilot_position:
          oneOf:
            - $ref: "#/components/schemas/Position"
            - type: "null"
        note: { type: string }
        retriever:
          oneOf:
            - type: object
              properties:
                user_id: { type: string, format: uuid }
                full_name: { type: string }
                phone: { type: string }
            - type: "null"
        retriever_position:
          oneOf:
            - type: object
              properties:
                lat: { type: number }
                lon: { type: number }
                h_acc_m: { type: [number, "null"] }
                t: { $ref: "#/components/schemas/Timestamp" }
            - type: "null"
        requested_at: { $ref: "#/components/schemas/Timestamp" }
        accepted_at: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }] }
        picked_up_at: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }] }
        delivered_at: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }] }
        cancelled_at: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }] }
        cancelled_by:
          oneOf:
            - $ref: "#/components/schemas/UserRef"
            - type: "null"
        cancel_reason: { type: string }
        delivery_note: { type: string }
        is_simulated: { type: boolean }
        updates:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              kind: { type: string, enum: [requested, accepted, released, assigned, picked_up, delivered, cancelled, note] }
              actor:
                oneOf:
                  - $ref: "#/components/schemas/UserRef"
                  - type: "null"
              body: { type: string }
              created_at: { $ref: "#/components/schemas/Timestamp" }
    RetrieverState:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        full_name: { type: string }
        on_duty: { type: boolean }
        position:
          oneOf:
            - $ref: "#/components/schemas/RetrieverFix"
            - type: "null"
        age_s: { type: [number, "null"] }
        active_retrievals: { type: integer }

    # ------------------------------------------------------------ live
    LivePilot:
      type: object
      properties:
        flight_id: { type: string, format: uuid }
        pilot: { $ref: "#/components/schemas/PilotRef" }
        is_simulated: { type: boolean }
        status: { type: string, enum: [recording, ended] }
        position:
          oneOf:
            - $ref: "#/components/schemas/Position"
            - type: "null"
        age_s: { type: [number, "null"] }
        freshness: { type: string, enum: [live, stale, lost], description: "live < 30 s, stale 30 s - 5 min, lost > 5 min since the last received position" }
        trail:
          type: array
          maxItems: 300
          description: "Last 15 minutes (by now), h_acc_m <= 50, simplified. Each point is [lon, lat, gps_alt_m|null, t_unix_ms]."
          items:
            type: array
            minItems: 4
            maxItems: 4
            prefixItems:
              - { type: number }
              - { type: number }
              - { type: [number, "null"] }
              - { type: integer }
    LiveSnapshot:
      type: object
      properties:
        event_id: { type: string, format: uuid }
        server_time: { $ref: "#/components/schemas/Timestamp" }
        cursor: { type: string, description: "Redis stream id; \"0-0\" if unavailable" }
        pilots:
          type: array
          description: Filtered per role; always empty for retrievers. Absent in the retrievals:<id> channel snapshot.
          items: { $ref: "#/components/schemas/LivePilot" }
        retrievals:
          type: array
          description: Open + closed in the last 2 h, filtered and redacted per role. Empty for guests.
          items: { $ref: "#/components/schemas/Retrieval" }
        retrievers:
          type: array
          description: Organizers/observers/admins all; a pilot only the retriever holding their open retrieval; a retriever only themself.
          items: { $ref: "#/components/schemas/RetrieverState" }

    # ------------------------------------------------------------ notifications / admin
    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [event_update, application, retrieval, flight, system] }
        title: { type: string }
        body: { type: string }
        data: { type: object }
        read_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        created_at: { $ref: "#/components/schemas/Timestamp" }
    AdminUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        full_name: { type: string }
        public_id: { type: [string, "null"] }
        roles: { type: array, items: { type: string, enum: [platform_admin] } }
        is_platform_admin: { type: boolean }
        email_verified: { type: boolean }
        must_change_password: { type: boolean }
        disabled: { type: boolean }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        disabled_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
    AuditEntry:
      type: object
      properties:
        id: { type: string, description: Numeric id as string }
        actor:
          oneOf:
            - $ref: "#/components/schemas/UserRef"
            - type: "null"
        action: { type: string, examples: [auth.login, retrieval.accepted, privacy.phone_revealed] }
        target_type: { type: string }
        target_id: { type: string }
        event_id: { type: [string, "null"], format: uuid }
        ip: { type: string }
        details: { type: object }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    AdminStats:
      type: object
      properties:
        generated_at: { $ref: "#/components/schemas/Timestamp" }
        active_events: { type: integer }
        pilots_in_air: { type: integer, description: Recording flights with data in the last 30 s }
        stale_sessions: { type: integer, description: Recording flights silent > 5 min }
        open_retrievals: { type: integer }
        pending_applications: { type: integer }
        recent_flights: { type: integer, description: Flights started in the last 24 h }
        users: { type: integer }
        system_status:
          type: object
          properties:
            checks:
              type: object
              properties:
                postgres: { type: string }
                redis: { type: string }
            outbox_depth: { type: integer }
            email_pending: { type: integer }
            email_failed_24h: { type: integer }

    # ------------------------------------------------------------ pages
    EventPage:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Event" } }
        next_cursor: { type: [string, "null"] }
    FlightPage:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Flight" } }
        next_cursor: { type: [string, "null"] }
    PositionPage:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Position" } }
        next_cursor: { type: [string, "null"] }
    NotificationPage:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Notification" } }
        next_cursor: { type: [string, "null"] }
    AdminUserPage:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AdminUser" } }
        next_cursor: { type: [string, "null"] }
    AuditPage:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
        next_cursor: { type: [string, "null"] }

paths:
  # ============================================================ health
  /health/live:
    get:
      operationId: getHealthLive
      tags: [health]
      security: [{}]
      summary: Liveness
      responses:
        "200":
          description: Process is up
          headers:
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /health/ready:
    get:
      operationId: getHealthReady
      tags: [health]
      security: [{}]
      summary: Readiness
      description: |
        200 `ok`; 200 `degraded` when Redis is down (ingestion still works, realtime is delayed — Addition: contract only lists ok/503);
        503 `unavailable` when PostgreSQL is down, 503 `draining` during shutdown.
      responses:
        "200":
          description: Ready (ok or degraded)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ready" }
        "503":
          description: Not ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ready" }
  /meta:
    get:
      operationId: getMeta
      tags: [health]
      security: [{}]
      summary: Environment metadata
      description: "Addition: not in the contract document. Used by the simulator to refuse register mode in production."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Meta" }

  # ============================================================ auth
  /auth/register:
    post:
      operationId: postAuthRegister
      tags: [auth]
      security: [{}]
      summary: Register a pilot account
      description: |
        Creates a user without any role (roles are per event; `roles: []`), a pilot profile and default preferences; queues welcome and verification emails.
        Addition: optional `client` (web|ios, default web) and `device_name`. Rate limit 5/min per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, full_name]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 10, description: "≥ 10 chars, not the email, not common, not the bootstrap password" }
                full_name: { type: string, maxLength: 200 }
                client: { type: string, enum: [web, ios], default: web }
                device_name: { type: string, maxLength: 100 }
      responses:
        "201":
          description: Created (web also sets the rf_refresh cookie)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/login:
    post:
      operationId: postAuthLogin
      tags: [auth]
      security: [{}]
      summary: Log in
      description: |
        Rate limits: 5/min per IP+email, 20/min per IP. An expired bootstrap password returns 401 with `details.reason = password_expired`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
                client: { type: string, enum: [web, ios], default: web }
                device_name: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Validation" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/refresh:
    post:
      operationId: postAuthRefresh
      tags: [auth]
      security: [{}, {refreshCookie: []}]
      summary: Rotate the refresh token
      description: |
        iOS sends `refresh_token` in the body; web relies on the rf_refresh cookie (an Origin header, if present, must be allowed).
        Presenting an already-rotated token revokes the whole session family (reuse detection) and returns 401.
        Rate limit 60/min per IP.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: Rotated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/logout:
    post:
      operationId: postAuthLogout
      tags: [auth]
      security: [{}, {refreshCookie: []}, {bearerAuth: []}]
      summary: Revoke the session
      description: Revokes the family of the presented refresh token (body or cookie), else of the access token's sid. Clears the cookie.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /auth/password/change:
    post:
      operationId: postAuthPasswordChange
      tags: [auth]
      summary: Change password
      description: |
        Allowed while must_change_password is set. Clears it, revokes all sessions (including the current one) and issues a
        new session of the same client type. Rate limit 10/min per user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string }
      responses:
        "200":
          description: Changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Validation" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/password/forgot:
    post:
      operationId: postAuthPasswordForgot
      tags: [auth]
      security: [{}]
      summary: Request a password reset email
      description: Always 202 (no account enumeration). Link `${APP_WEB_URL}/app/reset-password?token=…`, valid 1 h. Rate limit 5/min per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Accepted" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/password/reset:
    post:
      operationId: postAuthPasswordReset
      tags: [auth]
      security: [{}]
      summary: Reset password with a token
      description: Revokes all sessions and marks the email verified. Invalid/expired/used token → 422 details.token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token: { type: string }
                new_password: { type: string }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "422": { $ref: "#/components/responses/Validation" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/email/verify:
    post:
      operationId: postAuthEmailVerify
      tags: [auth]
      security: [{}]
      summary: Verify email
      description: Link `${APP_WEB_URL}/app/verify-email?token=…`, valid 48 h.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "422": { $ref: "#/components/responses/Validation" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/email/verify/resend:
    post:
      operationId: postAuthEmailVerifyResend
      tags: [auth]
      summary: Resend verification email
      description: No-op if already verified. Rate limit 3 per 10 min per user.
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Accepted" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  # ============================================================ me
  /me:
    get:
      operationId: getMe
      tags: [me]
      summary: Current user
      description: Allowed while must_change_password is set.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      operationId: patchMe
      tags: [me]
      summary: Update name and preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name: { type: string }
                preferences: { $ref: "#/components/schemas/Preferences" }
      responses:
        "200":
          description: Updated Me
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /me/pilot:
    patch:
      operationId: patchMePilot
      tags: [me]
      summary: Update pilot profile
      description: Partial PilotProfile; `public_id` and unknown fields are rejected (422). Creates the profile if missing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PilotProfile" }
      responses:
        "200":
          description: Updated Me
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /me/deletion-request:
    post:
      operationId: postMeDeletionRequest
      tags: [me]
      summary: Request account deletion
      description: |
        The account is anonymised after the grace period (ACCOUNT_DELETION_GRACE, default 14 days) unless cancelled.
        Addition: response includes `scheduled_for`. Repeating while pending is idempotent.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 2000 }
      responses:
        "202":
          description: Pending
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeletionRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
    delete:
      operationId: deleteMeDeletionRequest
      tags: [me]
      summary: Cancel account deletion
      description: "Addition: returns 200 {status: cancelled} (the contract does not specify a body)."
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: cancelled }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /me/export:
    get:
      operationId: getMeExport
      tags: [me]
      summary: Export own data
      description: Streams JSON {exported_at, me, devices (push tokens omitted, has_push_token flag), flights[] with positions[]}.
      responses:
        "200":
          description: JSON export (Content-Disposition attachment)
          content:
            application/json:
              schema:
                type: object
                properties:
                  exported_at: { $ref: "#/components/schemas/Timestamp" }
                  me: { $ref: "#/components/schemas/Me" }
                  devices: { type: array, items: { type: object } }
                  flights: { type: array, items: { type: object } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /me/devices:
    post:
      operationId: postMeDevices
      tags: [me]
      summary: Register / update a device (upsert by device_id)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Device" }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }

  # ============================================================ pilots
  /users/search:
    get:
      operationId: getUsersSearch
      tags: [pilots]
      summary: Search users (organizers of any event, platform admins)
      description: For adding organizers and members. Matches name, email or public_id; disabled/deleted users are excluded.
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/UserSearchItem" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /pilots/{public_id}:
    get:
      operationId: getPilotsPublicId
      tags: [pilots]
      security: [{}, {bearerAuth: []}]
      summary: Public pilot profile
      description: 404 unless public_profile is true (owners always see their own).
      parameters:
        - { name: public_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicPilot" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ============================================================ events
  /events:
    get:
      operationId: getEvents
      tags: [events]
      security: [{}, {bearerAuth: []}]
      summary: List events
      description: |
        Guests see public non-draft events; organizers and members also see restricted events they belong to (organizers
        also drafts); admins see all. Default status filter: published,active,completed (+draft for authenticated callers,
        still visibility-checked). `mine=true` limits to events where the caller is organizer or active member.
      parameters:
        - { name: status, in: query, description: Comma list, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: mine, in: query, schema: { type: boolean } }
        - { name: near, in: query, description: "lat,lon", schema: { type: string } }
        - { name: radius_km, in: query, description: "Default 50 when near is set", schema: { type: number } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
    post:
      operationId: postEvents
      tags: [events]
      summary: Create an event
      description: |
        platform_admin only. Slug generated from name if absent. Defaults: status draft, visibility public, settings
        applications_open/live_tracking/pilots_see_each_other/landing_prompt true, public_live_map false.
        Addition: optional `organizers: [user_id]` assigns organizers in the same transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/EventInput"
                - type: object
                  properties:
                    organizers: { type: array, items: { type: string, format: uuid } }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /events/{id}:
    parameters:
      - $ref: "#/components/parameters/EventIdOrSlug"
    get:
      operationId: getEventsId
      tags: [events]
      security: [{}, {bearerAuth: []}]
      summary: Get an event
      description: Restricted/draft events return 404 to non-members.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: patchEventsId
      tags: [events]
      summary: Update an event (organizer/admin)
      description: Status or schedule changes notify members (in-app + event_update email to verified members).
      requestBody:
        required: true
