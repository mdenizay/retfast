        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /flights/{id}/positions:
    parameters:
      - $ref: "#/components/parameters/FlightIdOrPublic"
    get:
      operationId: getFlightsIdPositions
      tags: [flights]
