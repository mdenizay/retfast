  # ============================================================ flights
  /flights:
    get:
      operationId: getFlights
      tags: [flights]
      summary: List flights
      description: |
        Default: own flights. `?event_id=` (members; admin/rescue see all, others see non-private plus own).
        `?pilot_id=` (admin/rescue: all; organizers: that pilot's non-private flights in events they organise).
      parameters:
        - { name: pilot_id, in: query, schema: { type: string, format: uuid } }
        - { name: event_id, in: query, schema: { type: string } }
        - { name: status, in: query, description: "Comma list of recording,ended,abandoned", schema: { type: string } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlightPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
    post:
      operationId: postFlights
      tags: [flights]
      summary: Create a flight (idempotent on id)
      description: |
        201 when created, 200 if the id already exists for this pilot, 409 if it belongs to someone else.
        With event_id the caller must be an active participant/organizer and the event must have live_tracking.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FlightCreate" }
      responses:
        "200":
          description: Existing flight
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Flight" }
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Flight" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /flights/{id}:
    parameters:
      - $ref: "#/components/parameters/FlightIdOrPublic"
    get:
      operationId: getFlightsId
      tags: [flights]
      security: [{}, {bearerAuth: []}]
      summary: Get a flight
      description: |
        Visible to: owner, admin, rescue_operator; everyone for public flights; active members of the flight's event for
        event flights; organizers for private flights only while an incident is open on them. Otherwise 404.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Flight" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: patchFlightsId
      tags: [flights]
      summary: Change visibility / event link (owner)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                visibility: { type: string, enum: [private, event, public] }
                event_id: { type: [string, "null"], format: uuid }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Flight" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /flights/{id}/end:
    parameters:
      - $ref: "#/components/parameters/FlightIdOrPublic"
    post:
      operationId: postFlightsIdEnd
      tags: [flights]
      summary: End a flight (owner, idempotent)
      description: Recomputes final statistics from all stored positions. ended_at defaults to now.
      requestBody:
        content:
          application/json:
