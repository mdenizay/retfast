        "404": { $ref: "#/components/responses/NotFound" }

  # ============================================================ telemetry
  /telemetry/batches:
    post:
      operationId: postTelemetryBatches
      tags: [telemetry]
      summary: Upload a telemetry batch (flight owner)
      description: |
        1–500 samples, body ≤ 512 KB (gzip `Content-Encoding` accepted). A sample is acknowledged if it is in `accepted`
        or `duplicate`; both are durable in PostgreSQL when the response is sent. Re-sending the same batch_id returns the
        same classification. Out-of-order and late samples are accepted. Missing/invalid sample `id` or `seq`, or a wrong
        sample count, fail the whole batch with 422. Rate limit 600 batches/min per user.
      parameters:
        - name: Content-Encoding
          in: header
          schema: { type: string, enum: [gzip] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TelemetryBatch" }
      responses:
        "200":
          description: Classification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TelemetryResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Validation" }
        "429": { $ref: "#/components/responses/RateLimited" }

  # ============================================================ realtime
  /realtime:
    get:
      operationId: getRealtime
      tags: [live]
      security: [{}]
      summary: Realtime WebSocket (upgrade)
      description: |
        WebSocket upgrade (`wss://api.retfast.com/api/v1/realtime`). Browser Origin must match an allowed CORS origin.

        **Client → server**
        - `{"type":"auth","access_token":"…"}` — first message within 10 s (guests may instead subscribe to public
          channels directly). A connection that sends nothing in 10 s is closed with 4001. Invalid/expired token or a
          password-change-required user → `error` (`unauthorized` | `token_expired` | `password_change_required`) and close 4001
          if not yet authenticated. May be resent to refresh the token.
        - `{"type":"subscribe","channel":"event:<uuid>"|"flight:<uuid or public_id>"|"incidents","since":"<cursor>"?}`
        - `{"type":"unsubscribe","channel":"…"}` → `{"type":"unsubscribed","channel":"…"}`
        - `{"type":"ping"}` → `{"type":"pong"}`; reply `{"type":"pong"}` to server pings.

        **Server → client**
        - `{"type":"auth_ok","user_id":"…"}`
        - `{"type":"subscribed","channel","snapshot","cursor","replayed":N}` — snapshot is always present: LiveSnapshot
          for event channels, Flight for flight channels, `{"items":[Incident]}` (open incidents in scope) for incidents.
          If `since` is inside the Redis stream window, the N missed messages follow immediately after `subscribed`.
          Addition: `replayed` count.
        - `{"type":"position","channel","cursor","data":{flight_id,pilot,is_simulated,status,position},"server_received_ms"}`
        - `{"type":"flight","channel","cursor","data":Flight,"server_received_ms"}`; when the subscriber can no longer
          see the flight (e.g. it became private) `data` is `{"id":"…","visibility":"…","removed":true}` (Addition).
        - `{"type":"incident","channel":"incidents","cursor","data":Incident,"server_received_ms"}`
        - `{"type":"error","code":"forbidden"|"unknown_channel"|"unauthorized"|"token_expired"|"password_change_required"|"bad_request"|"internal","channel"?}`
        - `{"type":"ping"}` every 25 s.

        `server_received_ms` (Addition) is the server receive time of the underlying data in unix ms, for latency measurement.
        Messages may be delivered more than once (at-least-once relay); dedupe by cursor / position seq.

        **Authorization** is checked at subscribe time and re-applied to every message using the message's current flight
        facts (visibility, open incident). Guests receive only public flights of public events with public_live_map,
        with display names. `incidents` requires platform_admin, rescue_operator (all incidents) or organizer of at least
        one event (incidents of those events).

        **Limits / close codes**: outbound queue 256 messages, overflow closes with 4008 (slow consumer); idle 60 s
        (no client message) closes with 1008; 4001 unauthorized; 1012 server restart. Reconnect with backoff (1 s → 30 s,
        jitter) and resubscribe with the last cursor.
      responses:
        "101":
          description: Switching Protocols
        "503":
          description: Server draining
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ============================================================ incidents
  /incidents:
    get:
      operationId: getIncidents
      tags: [incidents]
      summary: List incidents
      description: |
        Pilots: own. Admin/rescue_operator: all. Event organizers: incidents of their events plus own.
        Responder listings are audited (incident.contact_listed). Addition: `?mine=true` restricts to own incidents.
      parameters:
        - { name: status, in: query, description: Comma list, schema: { type: string } }
        - { name: event_id, in: query, schema: { type: string, format: uuid } }
        - { name: mine, in: query, schema: { type: boolean } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncidentPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
    post:
      operationId: postIncidents
      tags: [incidents]
      summary: Raise an SOS (idempotent on id)
      description: |
        201 created, 200 if the id exists for this pilot (a newer position in a re-send updates the incident), 409 if the
        id belongs to someone else. Notifies admins, rescue operators and organizers of the flight's event. Rate limit
        30/min per user.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IncidentCreate" }
      responses:
        "200":
          description: Existing incident
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /incidents/{id}:
    parameters:
      - $ref: "#/components/parameters/IncidentId"
    get:
      operationId: getIncidentsId
      tags: [incidents]
      summary: Get an incident (owner or responder; responder access is audited)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /incidents/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/IncidentId"
    post:
      operationId: postIncidentsIdCancel
      tags: [incidents]
      summary: Cancel (owner)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 1000 }
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /incidents/{id}/acknowledge:
    parameters:
      - $ref: "#/components/parameters/IncidentId"
    post:
      operationId: postIncidentsIdAcknowledge
      tags: [incidents]
      summary: Acknowledge (responder)
      description: Idempotent when already acknowledged/responding. Notifies the pilot (rescue_ack).
      responses:
        "200":
          description: Acknowledged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /incidents/{id}/status:
    parameters:
      - $ref: "#/components/parameters/IncidentId"
    post:
      operationId: postIncidentsIdStatus
      tags: [incidents]
      summary: Set responding / resolved (responder)
      description: "State machine: open → acknowledged → responding → resolved; resolved/cancelled are terminal (409)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [responding, resolved] }
                note: { type: string, maxLength: 4000 }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /incidents/{id}/notes:
    parameters:
      - $ref: "#/components/parameters/IncidentId"
    post:
      operationId: postIncidentsIdNotes
      tags: [incidents]
      summary: Add a note (responder)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        "201":
          description: Incident with the new update
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /incidents/{id}/assignments:
    parameters:
      - $ref: "#/components/parameters/IncidentId"
    post:
      operationId: postIncidentsIdAssignments
      tags: [incidents]
      summary: Assign a responder (responder)
      description: The assignee must itself be a responder for this incident (admin, rescue_operator or organizer of the event).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [responder_user_id]
              properties:
                responder_user_id: { type: string, format: uuid }
      responses:
        "201":
          description: Incident with assignments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }

  # ============================================================ rescue
  /rescue/assignments:
    get:
      operationId: getRescueAssignments
      tags: [rescue]
      summary: Own assignments (rescue_operator/admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Assignment" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /rescue/assignments/{id}/status:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: postRescueAssignmentsIdStatus
      tags: [rescue]
      summary: Update assignment status (assignee)
      description: Forward only (assigned → en_route → on_scene → completed); withdrawn from any active state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [en_route, on_scene, completed, withdrawn] }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Assignment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /rescue/me/status:
    put:
      operationId: putRescueMeStatus
      tags: [rescue]
      summary: Set availability (rescue_operator/admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [availability]
              properties:
                availability: { type: string, enum: [available, unavailable] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  availability: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /rescue/me/position:
    post:
      operationId: postRescueMePosition
      tags: [rescue]
      summary: Report own position (rescue_operator/admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lon, h_acc_m, t]
              properties:
                lat: { type: number }
                lon: { type: number }
                h_acc_m: { type: number }
                t: { $ref: "#/components/schemas/Timestamp" }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /rescue/team:
    get:
      operationId: getRescueTeam
      tags: [rescue]
      summary: Rescue team (admin, rescue_operator, or organizer of any event)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/RescueTeamMember" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ============================================================ notifications
  /notifications:
    get:
      operationId: getNotifications
      tags: [notifications]
      summary: List own notifications
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /notifications/{id}/read:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: postNotificationsIdRead
      tags: [notifications]
      summary: Mark one as read
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /notifications/read-all:
    post:
      operationId: postNotificationsReadAll
      tags: [notifications]
      summary: Mark all as read
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ============================================================ admin
  /admin/users:
    get:
      operationId: getAdminUsers
      tags: [admin]
      summary: Search users (platform_admin)
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: patchAdminUsersId
      tags: [admin]
      summary: Set roles / disable (platform_admin)
      description: roles replaces the full set. Admins cannot remove their own platform_admin role or disable themselves. Disabling revokes all sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                roles:
                  type: array
                  items: { type: string, enum: [pilot, observer, event_organizer, rescue_operator, platform_admin] }
                disabled: { type: boolean }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/users/{id}/reset-password:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: postAdminUsersIdResetPassword
      tags: [admin]
      summary: Send a password reset email (platform_admin)
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Accepted" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/audit:
    get:
      operationId: getAdminAudit
      tags: [admin]
      summary: Audit log (platform_admin)
      description: "`action` matches exactly or as a prefix (`incident` matches `incident.*`). limit default 100, max 500."
      parameters:
        - { name: actor_id, in: query, schema: { type: string, format: uuid } }
        - { name: action, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, maximum: 500 } }
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Dashboard counters (platform_admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminStats" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
