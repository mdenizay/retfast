name: Retfast
options:
  bundleIdPrefix: com.mizibu
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.24.0

targets:
  Retfast:
    type: application
    platform: iOS
    sources:
      - path: Retfast
    info:
      path: Retfast/Info.plist
      properties:
        CFBundleDisplayName: RETFAST
        # Bind the bundle version to the build settings — XcodeGen otherwise
        # writes a static "1"/"1.0" here and silently ignores
        # MARKETING_VERSION / CURRENT_PROJECT_VERSION, which App Store Connect
        # then rejects as a duplicate build number.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIBackgroundModes: [location]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: "RETFAST records your position during flights and retrieval duty so the operation can see and reach you."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Background location keeps your track and safety monitoring alive while the screen is locked during a flight or retrieval duty."
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mizibu.retfast
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 2
        SWIFT_VERSION: 5.10
        DEVELOPMENT_TEAM: JHW499P7S3
        TARGETED_DEVICE_FAMILY: 1
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "iPhone Distribution"
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "iPhone Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "RETFAST App Store 1788005612718"
